# remap prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind-key c new-window -c "#{pane_current_path}"

# split panes using | and - 
bind-key | split-window -h
bind-key - split-window -v
unbind '"'
unbind %

# reload config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# switch panes using Alt-hjkl without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize panes using Alt+Shift+hjkl (5 cells per press, prefix not needed)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Enable mouse control 
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# use vi-style keybindings in copy mode
setw -g mode-keys vi

# clipboard: this is a Wayland session (KDE Plasma), so use wl-copy from
# wl-clipboard; xclip/xsel are X11 tools (xclip is not even installed here).
# copy-command applies to every copy-pipe binding without an explicit command
# (Enter, C-j, MouseDragEnd1Pane and the y binding below).
set -s copy-command "wl-copy"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# reduce escape delay to avoid tmux intercepting ESC
set -sg escape-time 10
